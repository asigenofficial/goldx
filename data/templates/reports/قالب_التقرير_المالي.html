<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>{{title}}</title><style>
*{box-sizing:border-box}body{margin:0;color:#21332f;font:12px Tahoma,Arial,sans-serif}.sheet{padding:8mm;border-right:5px solid #183f3c}header{display:flex;justify-content:space-between;gap:20px;background:#183f3c;color:white;padding:22px}h1{font-size:25px;margin:0 0 10px}h2{font-size:19px;margin:0 0 8px}.muted{color:#796c53;font-size:11px;line-height:1.9}header .muted{color:#e0cf9c}.title{padding:22px 0 12px;border-bottom:2px solid #b58a32;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:22px}.stats:empty{display:none}.stats>div{padding:12px;background:#f0f5f3;border-top:3px solid #183f3c;break-inside:avoid}.stats b{display:block;font-size:17px;margin-top:10px;font-variant-numeric:tabular-nums}.stats svg{vertical-align:middle}table{width:100%;border-collapse:collapse;font-size:10px}th{padding:9px 5px;color:white;background:#183f3c;border:1px solid #45615d}td{padding:8px 5px;text-align:center;border-bottom:1px solid #dde7e2;overflow-wrap:anywhere}tbody tr:nth-child(even){background:#f5f8f6}tr{break-inside:avoid}thead{display:table-header-group}tfoot{display:table-row-group;background:#eee3ca;font-weight:bold}tfoot td{border-top:2px solid #b58a32}.signatures{display:flex;justify-content:space-between;margin-top:24px;padding:16px 0;border-top:1px solid #d6c49d;break-inside:avoid}footer{padding-top:20px;font-size:10px;color:#796c53;display:flex;justify-content:space-between}@page{size:{{page_size}};margin:10mm}@media print{.sheet{padding:0;border:0}body{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style></head><body><main class="sheet"><header><div><h2>{{issuer_name}}</h2><div class="muted">التقارير المالية · FINANCIAL REPORT</div></div><svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="#e0cf9c" stroke-width="1.6"><path d="M6 40h36M10 34V22h7v12M21 34V14h7v20M32 34V6h7v28M8 15l12-8 8 2 11-7"/></svg></header><section class="title"><h1>{{title}}</h1><div class="muted">{{subtitle}}</div></section><section class="stats">{{stats_html}}</section><table><thead><tr>{{headers_html}}</tr></thead><tbody>{{rows_html}}</tbody><tfoot>{{footer_html}}</tfoot></table><div class="signatures"><span>إعداد: ........................</span><span>اعتماد: ........................</span></div><footer><span>{{issuer_name}}</span><span>تاريخ إصدار التقرير: {{generated_at}}</span></footer></main></body></html>
