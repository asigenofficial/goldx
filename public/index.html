<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>goldx — نظام الفواتير والمحاسبة</title>
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" id="theme-color-meta" content="#faf8f5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/app.css?v=1.4.5" />
  <link rel="stylesheet" href="/css/clarity.css?v=8" />
  <link rel="stylesheet" href="/css/print.css" media="print" />
  <!-- تطبيق الثيم الذهبي والأبيض فوراً قبل رسم الصفحة لمنع أي وميض -->
  <script>
    (function(){
      document.documentElement.setAttribute('data-theme', 'gold');
      document.documentElement.setAttribute('color-scheme', 'light');
      localStorage.setItem('goldx_theme', 'gold');
    })();
  </script>
  <!-- مولد رمز QR (بدون أي اعتماد خارجي) -->
  <script src="/js/vendor/zqr.js"></script>
</head>
<body>
  <div id="app" class="app-loading">
    <div class="boot">
      <img class="boot-logo" src="/img/logo-banner.jpg" alt="GOLDX" width="82" height="82" style="border-radius:18px;box-shadow:0 8px 24px rgba(184,134,11,0.22);object-fit:cover" />
      <div class="boot-text" style="color:#b8860b;font-weight:700">نظام فواتير الذهب والمجوهرات…</div>
    </div>
  </div>

  <!-- طبقة النوافذ المنبثقة والتنبيهات -->
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root"></div>
  <div id="print-root" class="print-root"></div>

  <script type="module" src="/js/app.js?v=1.3.7"></script>
</body>
</html>
